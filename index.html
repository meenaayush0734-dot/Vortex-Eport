<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex Esport</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040208;--app:#07040F;--text:#F4F1FF;--text2:#D9D2F2;--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.06);--glass1:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.02);--nav:rgba(18,12,34,.88);--a1:#A855F7;--a2:#6366F1;--line:rgba(167,139,250,.2);--gold:#FACC15;--red:#FF4D6D;--ok:#4ADE80;--cyan:#22D3EE;--mut:#9C92BD}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
#app{max-width:420px;min-height:100vh;margin:0 auto;padding-bottom:110px;background:radial-gradient(circle at 85% -5%,rgba(124,58,237,.45),transparent 45%),radial-gradient(circle at 0% 40%,rgba(34,211,238,.12),transparent 40%),var(--app)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;gap:8px}
.brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:17px;letter-spacing:1.5px}
.brand span{color:var(--cyan)}
main{padding:0 16px}
.ttl{font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:1px}
h2.ttl{font-size:16px;margin:20px 0 12px;letter-spacing:1.5px}
.mut{color:var(--mut);font-size:13px}
.glass{background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.4);padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(120deg,#4C1D95,#7C3AED 45%,#1D4ED8);border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.55),transparent 70%)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15)}
.coinchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.4);color:var(--gold);font-weight:800;font-size:13px;box-shadow:0 0 14px rgba(250,204,21,.25)}
.pill{padding:6px 12px;border-radius:999px;background:var(--fill);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px}
.gbtn{height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2) 55%,#22D3EE);color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 8px 24px rgba(139,92,246,.45);padding:0 18px;cursor:pointer;font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.gbtn.sm{height:38px;font-size:13px;padding:0 16px;width:auto;border-radius:12px}
.gbtn:disabled{opacity:.45;box-shadow:none;cursor:default}
.abtn{height:38px;padding:0 14px;border-radius:12px;border:1px solid rgba(167,139,250,.35);background:var(--fill);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.abtn.danger{border-color:rgba(255,77,109,.5);color:#FF8FA3}
.abtn.ok{border-color:rgba(34,197,94,.5);color:var(--ok)}
.abtn:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:6px;padding:5px;border-radius:18px;background:var(--fill);border:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;height:40px;border:0;border-radius:14px;background:transparent;color:var(--mut);font-weight:700;font-family:inherit;cursor:pointer;font-size:13px}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 0 16px rgba(139,92,246,.5)}
.qa-row{display:flex;justify-content:space-between;margin:4px 0 20px}
.qa{border:0;background:none;color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;width:33%}
.qc{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#C4B5FD,#7C3AED 60%,#4C1D95);box-shadow:0 0 22px rgba(139,92,246,.6),inset 0 0 0 1px rgba(255,255,255,.2)}
.qc .ic{width:28px;height:28px;color:#fff}
.band{height:5px;background:linear-gradient(90deg,var(--a1),var(--cyan))}
.tc{padding:0;overflow:hidden}
.tc .in{padding:16px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--cyan));box-shadow:0 0 10px var(--a1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--fill);border:1px solid rgba(167,139,250,.18);border-radius:16px;padding:12px}
.box b{display:block;font-family:'Orbitron',sans-serif;font-size:17px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--fill);border:1px solid rgba(167,139,250,.18);border-radius:16px;padding:10px 6px;text-align:center}
.st b{display:block;font-family:'Orbitron',sans-serif;font-size:18px}
.st span{font-size:10px;color:var(--mut)}
.badge{font-size:10px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:999px}
.badge.good{background:rgba(34,197,94,.15);color:var(--ok)}
.badge.bad{background:rgba(255,77,109,.15);color:#FF8FA3}
.badge.warn{background:rgba(250,204,21,.15);color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600}
input,select,textarea{width:100%;height:48px;border-radius:14px;border:1px solid rgba(167,139,250,.25);background:var(--fill);color:var(--text);padding:0 14px;font-size:15px;font-family:inherit;margin-bottom:12px;color-scheme:dark}
textarea{height:auto;min-height:44px;padding:10px 14px;resize:none;margin-bottom:8px}
input[type=file]{height:auto;padding:10px;font-size:13px}
input.inp{width:110px;height:40px;margin:0;font-size:14px}
select.sel{width:auto;height:38px;margin:0;padding:0 10px;font-size:13px}
.note{padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:12px;font-weight:600}
.note.ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.note.err{background:rgba(255,77,109,.12);color:#FF8FA3;border:1px solid rgba(255,77,109,.3)}
.errbox{color:#FF8FA3;font-size:13px;min-height:18px;margin:0 0 10px}
.urow{padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.center{min-height:100vh;display:flex;align-items:center;padding:20px}
.qrwrap{background:#fff;border-radius:16px;padding:12px;display:flex;justify-content:center;margin:10px 0}
.payqr{display:block;width:100%;max-width:280px;margin:0 auto;border-radius:14px;background:#fff;padding:8px}
.bubble{max-width:82%;padding:10px 12px;border-radius:16px;margin-bottom:8px;font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.bubble.me{margin-left:auto;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-bottom-right-radius:4px}
.bubble.them{background:var(--fill2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble img{width:100%;border-radius:12px;margin-top:6px;display:block}
.bubble .who{font-size:11px;opacity:.75;margin-bottom:4px;font-weight:700}
.sys{text-align:center;font-size:12px;color:var(--mut);margin:10px 0}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sk{height:96px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.band{background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.iconbtn{position:relative}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;animation:splashOut .5s ease 1s forwards}
.sp-logo{font-family:'Orbitron',sans-serif;font-weight:800;font-size:26px;letter-spacing:3px;animation:pop .8s ease both}
.sp-logo span{color:var(--cyan)}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.emojibar{display:flex;gap:4px;overflow-x:auto;padding:6px;margin-top:4px;border-radius:16px;background:var(--fill);border:1px solid var(--line)}
.emojibar button{flex:0 0 auto;width:38px;height:38px;border:0;border-radius:12px;background:transparent;font-size:20px;cursor:pointer;padding:0}
.iconbtn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--fill);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.iconbtn .ic{width:20px;height:20px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px;border:0;background:transparent;color:inherit;font-family:inherit;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.setrow:last-child{border-bottom:0}
.setrow.danger{color:var(--red)}
.ritem{padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.ritem:last-child{border-bottom:0}
.claim{border:1px solid rgba(250,204,21,.45);border-radius:14px;padding:10px;background:rgba(250,204,21,.06)}
.claim .btns{display:flex;gap:8px;margin-top:10px}
.claim .btns button{flex:1}
.thread{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:16px;margin-bottom:8px;cursor:pointer;background:var(--fill);border:1px solid var(--line);width:100%;color:inherit;font-family:inherit;text-align:left}
.fileBtn{position:relative;overflow:hidden}
.fileBtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:396px;height:66px;border-radius:24px;background:var(--nav);backdrop-filter:blur(12px);border:1px solid var(--line);display:flex;padding:6px;gap:4px;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font-family:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;cursor:pointer}
nav button i{font-style:normal;font-size:18px}
nav button.on{color:#fff;background:linear-gradient(135deg,rgba(168,85,247,.5),rgba(34,211,238,.25));box-shadow:0 0 16px rgba(139,92,246,.45)}
.ic{width:22px;height:22px;flex:none;display:block}
.coinchip .ic{width:15px;height:15px}
nav button .ic{width:22px;height:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="splash"><div class="sp-logo">VORTEX <span>ESPORT</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage ----------
const MEM = {};
const load = (k, d) => {
  let raw = null;
  try { raw = localStorage.getItem(k); } catch (e) { raw = MEM[k] ?? null; }
  if (raw == null) return d;
  try { return JSON.parse(raw); } catch (e) { return d; }
};
const save = (k, v) => {
  const s = JSON.stringify(v);
  MEM[k] = s;
  try { localStorage.setItem(k, s); } catch (e) {}
  if (DB && CLOUD_READY[k]) { try { DB.ref('vx/' + k).set(s); } catch (e) {} }
};

// ---------- realtime sync (Firebase Realtime Database) ----------
const FB_CONFIG = {
  apiKey: "AIzaSyDct-TAfTqwQfkI5ThbNJtesCNdLUp75Lw",
  authDomain: "vortex-47757.firebaseapp.com",
  databaseURL: "https://vortex-47757-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vortex-47757",
  storageBucket: "vortex-47757.firebasestorage.app",
  messagingSenderId: "434824252904",
  appId: "1:434824252904:web:93399da8e12f2a55cda85d"
};
// Shared data goes to the cloud. Session and referral-used stay per device.
const CLOUD_KEYS = ['vx_users', 'vx_tournaments', 'vx_settings', 'vx_tickets', 'vx_notes', 'vx_withdraw'];
let LOADING = true;
const CLOUD_READY = {};
let DB = null;
try {
  if (window.firebase) {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    DB = firebase.database();
  }
} catch (e) { DB = null; }

let refreshTimer = null;
function refreshSoon() {
  const a = document.activeElement;
  // do not wipe a form the user is typing in; refresh once they leave the field
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) {
    a.addEventListener('blur', () => setTimeout(refreshSoon, 150), { once: true });
    return;
  }
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => render(), 50);
}

function startCloud() {
  if (!DB) { LOADING = false; return; } // no Firebase: app keeps working on this device only
  setTimeout(() => { if (LOADING) { LOADING = false; render(); } }, 2500);
  CLOUD_KEYS.forEach(k => {
    DB.ref('vx/' + k).on('value', snap => {
      const val = snap.val();
      if (val == null || typeof val !== 'string') {
        // cloud empty for this key: upload our local copy once
        if (!CLOUD_READY[k]) {
          CLOUD_READY[k] = true;
          if (MEM[k] != null) DB.ref('vx/' + k).set(MEM[k]);
        }
        return;
      }
      CLOUD_READY[k] = true;
      if (LOADING && CLOUD_KEYS.every(x => CLOUD_READY[x])) { LOADING = false; refreshSoon(); }
      if (val !== MEM[k]) {
        MEM[k] = val;
        try { localStorage.setItem(k, val); } catch (e) {}
        refreshSoon();
      }
    });
  });
}

// ---------- icons & constants ----------
const SV = p => `<svg viewBox="0 0 24 24" class="ic" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  play: SV('<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7A4.7 4.7 0 0 0 2 9.7v4.6A4.7 4.7 0 0 0 6.7 19c1.6 0 2.4-.8 3.3-1.8l.9-1h1.2l.9 1c.9 1 1.7 1.8 3.3 1.8a4.7 4.7 0 0 0 4.7-4.7V9.7A4.7 4.7 0 0 0 17.3 5z"/>'),
  trophy: SV('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>'),
  chat: SV('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  shield: SV('<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>'),
  coin: SV('<circle cx="12" cy="12" r="8"/><path d="M14.5 9.5c-.4-.7-1.2-1-2.5-1-1.5 0-2.5.7-2.5 1.8s1 1.5 2.5 1.7 2.5.6 2.5 1.8-1 1.8-2.5 1.8c-1.3 0-2.1-.3-2.5-1M12 6.5v1.2M12 16.3v1.2"/>'),
  star: SV('<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2-4.5-4.4 6.2-.9z"/>'),
  wallet: SV('<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>'),
  user: SV('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  bell: SV('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),

// Personal referral code: 5 letters from the name + 10 random characters, unique per user
const makeRefCode = (name, list) => {
  const CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rnd = n => Array.from({ length: n }, () => CH[Math.floor(Math.random() * CH.length)]).join('');
  let base = String(name || '').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 5);
  if (base.length < 5) base = (base + rnd(5)).slice(0, 5);
  let code;
  do { code = base + rnd(10); } while (list.some(u => u.ref === code));
  return code;
};
// Codes are no longer assigned automatically: the user taps "Generate referral"

function ensureRef(u){
  if (!u || u.role === 'owner' || !u.ref || u.refV === 2) return u;
  const list = users(); const p = list.find(x => x.id === u.id);
  if (!p) return u;
  p.ref = null; save('vx_users', list); return p;
}
function generateRef(){
  const u = me(); if (!u || u.ref || S.refLoading) return;
  S.refLoading = true; render();
  setTimeout(() => {
    const list = users(); const p = list.find(x => x.id === u.id);
    if (p && !p.ref) { p.ref = makeRefCode(p.name, list); p.refV = 2; save('vx_users', list); }
    S.refLoading = false; render();
  }, 1200);
}

function nextChatAt(uid){
  const last = getTix().filter(t => t.userId === uid && t.kind === 'chat')
    .reduce((mx, t) => Math.max(mx, new Date(t.createdAt).getTime()), 0);

}

  return n;
}

function compress(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

  const btn = joined ? `<button class="gbtn sm" disabled>JOINED</button>`
    : full ? `<button class="gbtn sm" disabled>FULL</button>`
    : `<button class="gbtn sm" data-act="join" data-id="${esc(t.id)}">JOIN</button>`;
  return `
  <div class="glass tc">
    <div class="band"></div>
    <div class="in">
      <div class="row"><span class="tag">${esc(t.mode)} · ${esc(t.game)}</span><span class="coinchip">${ICON.coin} ${Number(t.fee)||0}</span></div>
      <div class="ttl" style="font-size:17px;margin:12px 0 4px">${esc(t.title)}</div>

        <div class="box"><span class="mut">Slots</span><b>${t.players.length} / ${t.slots}</b></div>

      <div class="row"><span class="mut">${t.fee ? 'Entry '+t.fee+' coins' : 'Free entry'}</span>${btn}</div>
      ${roomBlock(t, u, joined)}
      ${cardTools(t, u, joined)}
    </div>
  </div>`;
}

// ---------- tournaments, results and stats ----------
const allTours = () => load('vx_tournaments', []);
const wdAll = () => load('vx_withdraw', []);
const wdOf = (uid, status) => wdAll().filter(w => w.userId === uid && w.status === status).reduce((s, w) => s + (Number(w.amount) || 0), 0);
function userStats(u){
  const ts = allTours();
  const joined = ts.filter(t => t.players.includes(u.id));
  let wins = 0, earned = 0;
  ts.forEach(t => ((t.result && t.result.winners) || []).forEach(w => {
    if (w.uid !== u.id) return;
    earned += Number(w.prize) || 0; if (w.pos === 1) wins++;
  }));
  const withdrawn = wdOf(u.id, 'paid'), pending = wdOf(u.id, 'pending');
  return { matches: joined.length, wins, earned, winRate: joined.length ? Math.round(wins / joined.length * 100) : 0,
    winnings: earned - withdrawn - pending, withdrawn, pending, joined };
}
function resultForm(t){
  const list = users();
  const names = t.players.map(id => { const p = list.find(x => x.id === id); return { id, name: p ? p.name : 'Unknown' }; });
  const prev = (t.result && t.result.winners) || [];
  const row = pos => {
    const w = prev.find(x => x.pos === pos) || {};
    return `<div class="grid2"><div><label>Place ${pos}</label><select name="uid${pos}"><option value="">-</option>${names.map(n => `<option value="${esc(n.id)}" ${w.uid === n.id ? 'selected' : ''}>${esc(n.name)}</option>`).join('')}</select></div>

  const u = me(); if (!isAdmin(u)) return;
  const ts = allTours(); const t = ts.find(x => x.id === f.elements.tid.value); if (!t) return;
  const winners = [1, 2, 3].map(pos => ({ pos, uid: f.elements['uid' + pos].value, prize: Math.max(0, Math.floor(Number(f.elements['prize' + pos].value) || 0)) })).filter(w => w.uid);

  t.result = { at: new Date().toISOString(), winners };

function wdForm(u, s){

function wdRequest(f){
  const u = me(); if (!u) return;
  const amt = Math.floor(Number(f.elements.amount.value) || 0);
  const upi = String(f.elements.upi.value || '').trim();
  const s = userStats(u);
  if (amt < 50) return flash('Minimum withdrawal is ₹50.', 'err');
  if (amt > s.winnings) return flash('Not enough winning balance.', 'err');
  if (!upi) return flash('Enter your UPI ID.', 'err');
  const list = wdAll();
  list.unshift({ id: msgId(), userId: u.id, userName: u.name, amount: amt, upi, status: 'pending', at: new Date().toISOString() });
  save('vx_withdraw', list);
  flash('Withdrawal request sent. Admin will pay it manually.');
}
function wdDecide(id, ok){
  const staff = me(); if (!isAdmin(staff)) return;
  const list = wdAll(); const w = list.find(x => x.id === id); if (!w || w.status !== 'pending') return;
  w.status = ok ? 'paid' : 'rejected'; w.decidedBy = staff.name; w.decidedAt = new Date().toISOString();
  save('vx_withdraw', list);
  addNote(w.userId, ok ? 'Withdrawal paid' : 'Withdrawal rejected', `₹${w.amount} to ${w.upi}`);
  flash(ok ? 'Marked as paid.' : 'Request rejected.', ok ? 'ok' : 'err');
}

// ---------- leaderboard ----------
function boardView(u){
  const range = S.boardRange || 'all', sortBy = S.boardSort || 'wins';
  const now = Date.now();
  const cutoff = range === 'week' ? now - 7 * 864e5 : range === 'month' ? now - 30 * 864e5 : 0;
  const rows = {};
  users().filter(x => x.role !== 'owner').forEach(x => rows[x.id] = { u: x, wins: 0, earned: 0, matches: 0 });
  allTours().forEach(t => t.players.forEach(id => { if (rows[id]) rows[id].matches++; }));
  allTours().filter(t => t.result && new Date(t.result.at).getTime() >= cutoff).forEach(t => t.result.winners.forEach(w => {
    const r = rows[w.uid]; if (!r) return;
    r.earned += Number(w.prize) || 0; if (w.pos === 1) r.wins++;
  }));
  const list = Object.values(rows).filter(r => r.wins || r.earned)
    .sort((a, b) => sortBy === 'earn' ? (b.earned - a.earned) || (b.wins - a.wins) : (b.wins - a.wins) || (b.earned - a.earned)).slice(0, 20);

// ---------- haptic + sound feedback ----------
function fx(){
  const p = getPrefs().fx || {};
  if (p.haptic && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  if (p.sound) {
    try {
      const C = window.AudioContext || window.webkitAudioContext; const c = new C();
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = 0.04; o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.05);
    } catch (e) {}
  }
}

let TYPING = {};
let typingTimer = null, typingSentAt = 0;
function sendTyping(tid){
  if (!DB) return;
  const u = me(); if (!u) return;
  const ref = DB.ref('typing/' + tid + '/' + u.id);
  if (Date.now() - typingSentAt > 2000) {
    typingSentAt = Date.now();
    ref.set({ name: isSupport(u) ? 'Vortex Admin' : u.name });
    ref.onDisconnect().remove();
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => stopTyping(tid), 4000);
}
function stopTyping(tid){
  clearTimeout(typingTimer);
  typingSentAt = 0;
  const u = me();
  if (DB && u && tid) DB.ref('typing/' + tid + '/' + u.id).remove();
}
function startTyping(){
  if (!DB) return;
  DB.ref('typing').on('value', snap => { TYPING = snap.val() || {}; updateTypingLine(); });
}
function updateTypingLine(){
  const el = document.getElementById('typingLine'); if (!el) return;
  const u = me();
  const map = (u && S.ticketId && TYPING[S.ticketId]) || {};
  const names = Object.keys(map).filter(id => id !== (u && u.id) && map[id] && map[id].name).map(id => map[id].name);
  el.innerHTML = names.length ? `${esc(names[0])} is typing<span class="dots"><i></i><i></i><i></i></span>` : '';
}

    <input type="checkbox" data-act="hideme" ${u.privacyHide ? 'checked' : ''}></label></div>
    <div class="mut" style="margin-top:8px;font-size:12px">Hidden players show as "Private player" to everyone except owner, admin and staff.</div>`;
  if (sub === 'security') return `<div class="glass"><form id="passForm">
    <label>Current password</label><input name="cur" type="password" required>
    <label>New password (min 6)</label><input name="nw" type="password" required minlength="6">
    <label>Confirm new password</label><input name="cf" type="password" required minlength="6">
    <button class="gbtn" type="submit">CHANGE PASSWORD</button>
  </form></div>`;
  if (sub === 'help') return `<div class="glass"><div class="mut">Need help with coins, tickets or a tournament?</div>
    <button class="gbtn" style="margin-top:12px" data-act="nav" data-v="chat">OPEN SUPPORT</button></div>`;
  if (sub === 'about') return `<div class="glass"><b>Vortex Esport</b>
    <p class="mut" style="margin:8px 0">Tournament app for Free Fire India, Free Fire MAX and BGMI. Join matches with coins, get room details and win prizes.</p>
    <div class="mut" style="font-size:12px">Version 1.0</div></div>`;
  return '';
}

// ---------- profile / room / password / emoji actions ----------
function saveProfile(f){
  const u = me(); if (!u) return;
  const name = String(f.elements.fullname.value || '').trim().slice(0, 30);
  if (name.length < 2) return flash('Name must be at least 2 characters.', 'err');
  const list = users(); const p = list.find(x => x.id === u.id);
  p.name = name; p.bio = String(f.elements.bio ? f.elements.bio.value : '').trim().slice(0, 120);
  save('vx_users', list); flash('Profile updated.');
}
function changePassword(f){
  const u = me(); if (!u) return;
  const cur = f.elements.cur.value, nw = f.elements.nw.value, cf = f.elements.cf.value;
  if (cur !== u.password) return flash('Current password is wrong.', 'err');
  if (nw.length < 6) return flash('New password must be at least 6 characters.', 'err');
  if (nw !== cf) return flash('Passwords do not match.', 'err');
  const list = users(); const p = list.find(x => x.id === u.id);
  p.password = nw; save('vx_users', list); f.reset(); flash('Password changed.');
}
function saveRoom(f){
  const u = me(); if (!isSupport(u)) return;
  const ts = load('vx_tournaments', []); const t = ts.find(x => x.id === f.elements.tid.value);
  if (!t) return;
  t.roomId = String(f.elements.roomId.value || '').trim().slice(0, 40);
  t.roomPass = String(f.elements.roomPass.value || '').trim().slice(0, 40);
  save('vx_tournaments', ts);
  t.players.forEach(id => addNote(id, 'Room details', `${t.title} · ID ${t.roomId || '-'}`));
  S.roomEditId = null; flash('Room details saved.');
}
function insertEmoji(e){
  const ta = document.querySelector('#chatForm textarea'); if (!ta) return;
  const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? s;
  ta.value = ta.value.slice(0, s) + e + ta.value.slice(en);
  ta.focus(); const pos = s + e.length; ta.setSelectionRange(pos, pos);
  DRAFT = { tid: S.ticketId, text: ta.value, img: DRAFT.tid === S.ticketId ? DRAFT.img : null };
  sendTyping(S.ticketId);
}

function render(){
  applyPrefs();
  let u = me();
  let html;
  if (!u) html = authView();
  else if (u.banned && u.role !== 'owner') html = banView();
  else { u = ensureVid(ensureRef(u)); html = shell(u); }
  $('#app').innerHTML = html;
  if (u && S.qrAmt && document.getElementById('qrbox')) makeQR(S.qrAmt);
  updateTypingLine();
}

function makeQR(amt){
  const box = document.getElementById('qrbox');
  box.innerHTML = '';
  if (typeof QRCode === 'undefined') { box.textContent = 'Could not load the QR. Check your internet.'; return; }
  new QRCode(box, { text: upiLink(amt), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
}

// ---------- actions ----------
function authSubmit(f){
  const d = Object.fromEntries(new FormData(f));
  const email = String(d.email || '').trim().toLowerCase();
  const pass = String(d.password || '');
  const list = users();
  const setErr = m => { const e = $('#err'); if (e) e.textContent = m; };

  if (S.tab === 'register') {
    if (list.some(u => u.email === email)) return setErr('This email is already registered. Please log in.');
    const code = String(d.ref || '').trim().toUpperCase();
    let referrer = null, note = '';
    if (code) {
      if (load('vx_ref_used', false)) note = 'A referral was already used on this device, so the code was not applied.';
      else {
        referrer = list.find(x => x.ref === code);
        if (!referrer) return setErr('Invalid referral code.');
      }
    }
    const bonus = referrer ? 5 : 0;
    const u = { id:'u_' + Date.now().toString(36), name:String(d.name||'').trim(), email, password:pass, role:'player',
      coins:bonus, banned:false, ref:null, referredBy: referrer ? referrer.id : null };
    if (referrer) referrer.coins = coinsOf(referrer) + 5;
    list.push(u);
    save('vx_users', list);
    if (referrer) save('vx_ref_used', true);
    save('vx_session', u.id);
    S.page = 'play';
    S.flash = referrer ? { m:'Referral applied! You received 5 coins.', t:'ok' } : (note ? { m:note, t:'err' } : null);
  } else {
    const u = list.find(x => x.email === email && x.password === pass);
    if (!u) return setErr('Wrong email or password.');
    save('vx_session', u.id);
    S.page = 'play';
  }
  render();
}

function joinT(id){
  const u = me(); if (!u) return;
  const ts = load('vx_tournaments', []);
  const t = ts.find(x => x.id === id);
  if (!t || t.players.includes(u.id)) return;
  if (t.players.length >= t.slots) return flash('Slots are full.', 'err');
  const list = users();
  const p = list.find(x => x.id === u.id);
  if (coinsOf(p) < (Number(t.fee) || 0)) return flash(`Not enough coins. Entry is ${t.fee} coins.`, 'err');
  p.coins = coinsOf(p) - (Number(t.fee) || 0);
  t.players.push(u.id);
  save('vx_users', list);
  save('vx_tournaments', ts);
  flash('Joined the tournament!');
}

function tournamentFields(d){
  return {
    title: String(d.title || '').trim(), game: d.game, mode: d.mode, date: d.date,
    fee: Math.max(0, Math.floor(Number(d.fee) || 0)), prize: Number(d.prize) || 0,
    slots: Math.max(2, Number(d.slots) || 2),
    roomId: String(d.roomId || '').trim().slice(0, 40), roomPass: String(d.roomPass || '').trim().slice(0, 40),
    rules: String(d.rules || '').trim().slice(0, 600)
  };
}

function saveTournament(f){
  const u = me(); if (!isAdmin(u)) return;
  const d = Object.fromEntries(new FormData(f));
  const fields = tournamentFields(d);
  const ts = load('vx_tournaments', []);
  if (S.editId) {
    const t = ts.find(x => x.id === S.editId);
    if (!t || (u.role !== 'owner' && t.createdBy !== u.id)) return flash('You cannot edit this tournament.', 'err');
    if (fields.slots < t.players.length) return flash(`Slots cannot be less than ${t.players.length}.`, 'err');
    Object.assign(t, fields);
    S.editId = null;
    save('vx_tournaments', ts);
    return flash('Tournament updated.');
  }
  ts.unshift({ id:'t_' + Date.now().toString(36), ...fields, players:[], createdBy:u.id });
  save('vx_tournaments', ts);
  addNote('all', 'New tournament', `${fields.title} · ${fields.game}`);
  flash('Tournament published.');
}

function delT(id){
  const u = me(); if (!isAdmin(u)) return;
  const ts = load('vx_tournaments', []);
  const t = ts.find(x => x.id === id);
  if (!t || (u.role !== 'owner' && t.createdBy !== u.id)) return;
  save('vx_tournaments', ts.filter(x => x.id !== id));
  flash('Tournament deleted.');
}

function setRole(id, role){
  const u = me(); if (!isAdmin(u)) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || t.role === 'owner' || t.id === u.id) return;
  const allowed = u.role === 'owner' ? ['player', 'staff', 'admin'] : ['player', 'staff'];
  if (!allowed.includes(role)) return;
  if (u.role === 'admin' && t.role !== 'player') return;
  t.role = role;
  save('vx_users', list);
  flash(`${t.name} is now ${roleLabel(t.role)}.`);
}

function toggleBan(id){
  const u = me(); if (!u) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || !canManage(u, t)) return;
  t.banned = !t.banned;
  save('vx_users', list);
  flash(`${t.name} ${t.banned ? 'has been banned' : 'has been unbanned'}.`, t.banned ? 'err' : 'ok');
}

function setCoins(id){
  const u = me(); if (!u) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || !canManage(u, t)) return;
  const v = document.getElementById('c_' + id);
  const n = Math.max(0, Math.floor(Number(v && v.value) || 0));
  t.coins = n;
  save('vx_users', list);
  flash(`${t.name}'s coins set to ${n}.`);
}

function selfCoins(mode){
  const u = me(); if (!isAdmin(u)) return;
  const v = Math.floor(Number(document.getElementById('c_self').value));
  if (!(v >= 0) || (mode === 'add' && v === 0)) return flash('Enter a valid amount.', 'err');
  const list = users();
  const p = list.find(x => x.id === u.id);
  p.coins = mode === 'add' ? coinsOf(p) + v : v;
  save('vx_users', list);
  flash(mode === 'add' ? `${v} coins added.` : `Coins set to ${v}.`);
}

function addCoinsStart(){
  const s = getSet();
  if (!s.upiId) return flash('Admin has not set a UPI ID yet.', 'err');
  const v = Math.floor(Number(document.getElementById('amt').value));
  if (!(v >= 10 && v <= 100000)) return flash('Enter an amount between 10 and 1,00,000.', 'err');
  S.qrAmt = v;
  S.claimOpen = false;
  render();
}

function savePaySettings(f){
  const d = Object.fromEntries(new FormData(f));
  save('vx_settings', { upiId: String(d.upiId||'').trim(), upiName: String(d.upiName||'').trim() || 'Vortex Esport' });
  flash('Payment settings saved.');
}

function newSubmit(f){
  const u = me(); if (!u) return;
  const d = new FormData(f);
  const subject = String(d.get('subject') || '').trim();
  const text = String(d.get('msg') || '').trim();
  if (!subject) return flash('Please enter a subject.', 'err');
  if (nextChatAt(u.id) > Date.now()) return flash('You can open only one ticket every 2 days.', 'err');
  const tid = 'tk' + Date.now().toString(36);
  const messages = text ? [{ id: msgId(), role:'user', name:u.name, type:'text', text, at:new Date().toISOString() }] : [];
  const t = getTix();
  t.unshift({ id:tid, userId:u.id, userName:u.name, subject, kind:'chat', status:'open', createdAt:new Date().toISOString(), messages });
  saveTix(t);
  S.newOpen = false;
  S.ticketId = tid;
  flash('Ticket created.');
}

async function claimSubmit(f){
  const u = me(); if (!u) return;
  const d = new FormData(f);
  const file = d.get('img');
  if (!file || !file.size) return flash('Screenshot is required.', 'err');
  let shot;
  try { shot = await compress(file); } catch (e) { return flash('Could not load the screenshot.', 'err'); }
  const tid = 'tk' + Date.now().toString(36);
  const t = getTix();
  t.unshift({ id:tid, userId:u.id, userName:u.name, subject:`Coins claim: ${S.claimAmt} coins`, kind:'claim', status:'open', createdAt:new Date().toISOString(),
    messages:[{ id:msgId(), role:'user', name:u.name, type:'claim', amount:S.claimAmt, txn:String(d.get('txn')||'').trim(), img:shot, status:'pending', at:new Date().toISOString() }] });
  saveTix(t);
  S.claimOpen = false; S.qrAmt = 0; S.claimAmt = 0; S.ticketId = tid;
  flash('Claim sent. Admin will verify it and add the coins.');
}

async function chatSubmit(f){
  const u = me(); if (!u) return;
  const tid = f.elements.tid.value;
  const t = getTix().find(x => x.id === tid);
  if (!t || t.status !== 'open') return flash('This ticket is closed.', 'err');
  const staff = isSupport(u);
  if (!staff && t.userId !== u.id) return;
  const text = String(f.elements.msg.value || '').trim();
  const img = DRAFT.tid === tid ? DRAFT.img : null;
  if (!text && !img) return;
  const role = staff ? 'staff' : 'user';
  if (text) addMsg(tid, { role, name:u.name, type:'text', text });
  if (img) addMsg(tid, { role, name:u.name, type:'img', img });
  DRAFT = { tid: null, text: '', img: null };
  stopTyping(tid);
  render();
}

function closeTicket(tid){
  const u = me(); if (!isAdmin(u)) return;
  const t = getTix(); const tk = t.find(x => x.id === tid);
  if (!tk || tk.status !== 'open') return;
  tk.status = 'closed'; tk.closedBy = u.name;
  saveTix(t);
  addMsg(tid, { role:'sys', type:'sys', text:`Ticket closed by ${u.name}.` });
  flash('Ticket closed.');
}

function decideClaim(tid, mid, ok){
  const staff = me(); if (!isAdmin(staff)) return;
  const t = getTix(); const tk = t.find(x => x.id === tid);
  if (!tk || tk.status !== 'open') return;
  const m = tk.messages.find(x => x.id === mid);
  if (!m || m.status !== 'pending') return;
  if (ok) {
    const list = users(); const p = list.find(x => x.id === tk.userId);
    if (p) { p.coins = coinsOf(p) + Number(m.amount); save('vx_users', list); }
  }
  m.status = ok ? 'approved' : 'rejected';
  m.decidedBy = staff.name;
  saveTix(t);
  addMsg(tid, { role:'sys', type:'sys', text: ok ? `${m.amount} coins have been added to your account.` : 'Claim was rejected.' });
  addNote(tk.userId, ok ? 'Coins added' : 'Claim rejected', ok ? `${m.amount} coins added to your account.` : 'Your coins claim was rejected.');
  flash(ok ? 'Coins added.' : 'Claim rejected.', ok ? 'ok' : 'err');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  fx();
  if (a === 'tab') { S.tab = el.dataset.v; render(); }
  else if (a === 'nav') {
    S.page = el.dataset.v;
    S.claimOpen = false; S.ticketId = null; S.newOpen = false;
    render();
  }
  else if (a === 'sub') { S.sub = el.dataset.v; render(); }
  else if (a === 'game') { S.game = el.dataset.v; render(); }
  else if (a === 'join') joinT(el.dataset.id);
  else if (a === 'edit') { S.editId = el.dataset.id; S.sub = 'tour'; render(); }
  else if (a === 'canceledit') { S.editId = null; render(); }
  else if (a === 'del') delT(el.dataset.id);
  else if (a === 'ban') toggleBan(el.dataset.id);
  else if (a === 'coins') setCoins(el.dataset.id);
  else if (a === 'selfcoins') selfCoins(el.dataset.v);
  else if (a === 'addcoins') addCoinsStart();
  else if (a === 'genref') generateRef();
  else if (a === 'notesopen') { const u = me(); if (!u) return; S.unreadIds = myNotes(u).filter(n => !(n.readBy || []).includes(u.id)).map(n => n.id); markNotesRead(u); S.page = 'notes'; render(); }
  else if (a === 'boardrange') { S.boardRange = el.dataset.v; render(); }
  else if (a === 'boardsort') { S.boardSort = el.dataset.v; render(); }
  else if (a === 'presetnew') { S.newOpen = true; S.newPreset = el.dataset.v; render(); }
  else if (a === 'result') { S.resultId = S.resultId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'wdpaid') wdDecide(el.dataset.id, true);
  else if (a === 'wdno') wdDecide(el.dataset.id, false);
  else if (a === 'settings') { S.page = 'settings'; S.settingsSub = null; render(); }
  else if (a === 'setsub') { S.settingsSub = el.dataset.v || null; render(); }
  else if (a === 'roster') { S.rosterId = S.rosterId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'roomedit') { S.roomEditId = S.roomEditId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'emoji') insertEmoji(el.dataset.v);
  else if (a === 'theme') { const p = getPrefs(); p.theme = el.dataset.v; savePrefs(p); applyPrefs(); render(); }
  else if (a === 'color') { const p = getPrefs(); p.color = el.dataset.v; savePrefs(p); applyPrefs(); render(); }
  else if (a === 'copyref') {
    const u = me();
    const txt = u && u.ref;
    try { navigator.clipboard.writeText(txt); flash('Code copied: ' + txt); } catch (err) { flash('Code: ' + txt); }
  }
  else if (a === 'dlqr') {
    const c = document.querySelector('#qrbox canvas');
    if (!c) return flash('QR is not ready yet.', 'err');
    const link = document.createElement('a');
    link.href = c.toDataURL('image/png');
    link.download = 'vortex-qr-' + S.qrAmt + '.png';
    link.click();
  }
  else if (a === 'claim') { S.claimAmt = S.qrAmt; S.claimOpen = true; S.page = 'chat'; S.ticketId = null; render(); }
  else if (a === 'claimcancel') { S.claimOpen = false; render(); }
  else if (a === 'newopen') { S.newOpen = true; render(); }
  else if (a === 'newcancel') { S.newOpen = false; render(); }
  else if (a === 'open') { S.ticketId = el.dataset.id; render(); }
  else if (a === 'tkback') { S.ticketId = null; render(); }
  else if (a === 'clearimg') { DRAFT.img = null; render(); }
  else if (a === 'close') closeTicket(el.dataset.id);
  else if (a === 'claimok') decideClaim(el.dataset.tid, el.dataset.id, true);
  else if (a === 'claimno') decideClaim(el.dataset.tid, el.dataset.id, false);
  else if (a === 'logout') { save('vx_session', null); S.page = 'play'; S.tab = 'login'; S.qrAmt = 0; S.claimOpen = false; S.ticketId = null; render(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'role') setRole(el.dataset.id, el.value);
  const me0 = me();
  if (me0 && (el.name === 'avatar' || el.name === 'cover') && el.form && el.form.id === 'profileForm' && el.files && el.files[0]) {
    try {
      const img = await compress(el.files[0]);
      const list = users(); const p = list.find(x => x.id === me0.id);
      if (p) { p[el.name] = img; save('vx_users', list); }
    } catch (err) { return flash('Could not load the photo.', 'err'); }
    return flash(el.name === 'avatar' ? 'Profile picture updated.' : 'Cover photo updated.');
  }
  if (me0 && el.dataset && el.dataset.act === 'hideme') {
    const list = users(); const p = list.find(x => x.id === me0.id);
    if (p) { p.privacyHide = el.checked; save('vx_users', list); }
  }
  if (el.dataset && el.dataset.act === 'notif') {
    const p = getPrefs(); p.notif = { ...p.notif, [el.dataset.v]: el.checked }; savePrefs(p);
  }
  if (el.dataset && el.dataset.act === 'lang') { const p = getPrefs(); p.lang = el.value; savePrefs(p); render(); }
  if (el.dataset && el.dataset.act === 'fx') { const p = getPrefs(); p.fx = { ...p.fx, [el.dataset.v]: el.checked }; savePrefs(p); }
  const form = el.form;
  if (el.name === 'img' && form && form.id === 'chatForm' && el.files && el.files[0]) {
    const tid = form.elements.tid.value;
    const text = form.elements.msg.value;
    try {
      const shot = await compress(el.files[0]);
      DRAFT = { tid, text, img: shot };
    } catch (err) { return flash('Could not load the photo.', 'err'); }
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.name === 'msg' && el.form && el.form.id === 'chatForm') {
    const tid = el.form.elements.tid.value;
    DRAFT = { tid, text: el.value, img: DRAFT.tid === tid ? DRAFT.img : null };
    sendTyping(tid);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'authForm') authSubmit(e.target);
  else if (id === 'tForm') saveTournament(e.target);
  else if (id === 'payForm') savePaySettings(e.target);
  else if (id === 'newForm') newSubmit(e.target);
  else if (id === 'claimForm') claimSubmit(e.target);
  else if (id === 'chatForm') chatSubmit(e.target);
  else if (id === 'profileForm') saveProfile(e.target);
  else if (id === 'passForm') changePassword(e.target);
  else if (id === 'roomForm') saveRoom(e.target);
  else if (id === 'resultForm') saveResult(e.target);
  else if (id === 'wdForm') wdRequest(e.target);
  else if (id === 'annForm') { const u = me(); if (!isAdmin(u)) return; addNote('all', 'Announcement', String(e.target.elements.text.value || '').trim().slice(0, 300)); e.target.reset(); flash('Announcement posted.'); }
});

// ---------- start ----------
seed();
render();
startCloud();
startTyping();
setInterval(checkAlerts, 60000);
setTimeout(() => { const s = document.getElementById('splash'); if (s) s.remove(); }, 1500);
</script>
