<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vortex Esport</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navglass:rgba(20,16,40,.28);--bg:#040208;--app:#07040F;--text:#F4F1FF;--text2:#D9D2F2;--fill:rgba(255,255,255,.05);--fill2:rgba(255,255,255,.06);--glass1:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.02);--nav:rgba(18,12,34,.88);--a1:#A855F7;--a2:#6366F1;--line:rgba(167,139,250,.2);--gold:#FACC15;--red:#FF4D6D;--ok:#4ADE80;--cyan:#22D3EE;--mut:#9C92BD;--glow:rgba(124,58,237,.45);--glow2:rgba(34,211,238,.12);--shadow:rgba(139,92,246,.45);--hero1:#4C1D95;--hero2:#1D4ED8;--brandc:#22D3EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}
#app{max-width:420px;min-height:100vh;margin:0 auto;padding-bottom:110px;background:radial-gradient(circle at 85% -5%,var(--glow),transparent 45%),radial-gradient(circle at 0% 40%,var(--glow2),transparent 40%),var(--app)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;gap:8px}
.brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:17px;letter-spacing:1.5px}
.brand span{color:var(--brandc)}
main{padding:0 16px}
.ttl{font-family:'Orbitron',sans-serif;font-weight:800;letter-spacing:1px}
h2.ttl{font-size:16px;margin:20px 0 12px;letter-spacing:1.5px}
.mut{color:var(--mut);font-size:13px}
.glass{background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.4);padding:16px;margin-bottom:14px}
.hero{color:#fff;background:linear-gradient(120deg,var(--hero1),var(--a1) 45%,var(--hero2));border:0;position:relative;overflow:hidden}
.hero .tag{color:#fff;background:rgba(0,0,0,.35)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.55),transparent 70%)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15)}
.coinchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.4);color:var(--gold);font-weight:800;font-size:13px;box-shadow:0 0 14px rgba(250,204,21,.25)}
.pill{padding:6px 12px;border-radius:999px;background:var(--fill);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.5px}
.gbtn{height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--a1),var(--a2) 55%,var(--cyan));color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 8px 24px var(--shadow);padding:0 18px;cursor:pointer;font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.gbtn.sm{height:38px;font-size:13px;padding:0 16px;width:auto;border-radius:12px}
.gbtn:disabled{opacity:.45;box-shadow:none;cursor:default}
.abtn{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--fill);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.abtn.danger{border-color:rgba(255,77,109,.5);color:#FF8FA3}
.abtn.ok{border-color:rgba(34,197,94,.5);color:var(--ok)}
.abtn:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:6px;padding:5px;border-radius:18px;background:var(--fill);border:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;height:40px;border:0;border-radius:14px;background:transparent;color:var(--mut);font-weight:700;font-family:inherit;cursor:pointer;font-size:13px}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 0 16px var(--shadow)}
.qa-row{display:flex;justify-content:space-between;margin:4px 0 20px}
.qa{border:0;background:none;color:var(--text2);font-family:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;width:33%}
.qc{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,var(--a1),var(--a2) 60%,var(--hero1));box-shadow:0 0 22px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.2)}
.qc .ic{width:28px;height:28px;color:#fff}
.band{height:5px;background:linear-gradient(90deg,var(--a1),var(--cyan))}
.tc{padding:0;overflow:hidden}
.tc .in{padding:16px}

.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 14px}

.box{background:var(--fill);border:1px solid var(--line);border-radius:16px;padding:12px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--fill);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.st b{display:block;font-family:'Orbitron',sans-serif;font-size:18px}
.st span{font-size:10px;color:var(--mut)}
.badge{font-size:10px;font-weight:800;letter-spacing:1px;padding:4px 8px;border-radius:999px}
.badge.good{background:rgba(34,197,94,.15);color:var(--ok)}
.badge.bad{background:rgba(255,77,109,.15);color:#FF8FA3}
.badge.warn{background:rgba(250,204,21,.15);color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:600}
input,select,textarea{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--fill);color:var(--text);padding:0 14px;font-size:15px;font-family:inherit;margin-bottom:12px;color-scheme:dark}
textarea{height:auto;min-height:44px;padding:10px 14px;resize:none;margin-bottom:8px}
input[type=file]{height:auto;padding:10px;font-size:13px}
input.inp{width:110px;height:40px;margin:0;font-size:14px}
select.sel{width:auto;height:38px;margin:0;padding:0 10px;font-size:13px}
.note{padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:12px;font-weight:600}
.note.ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.note.err{background:rgba(255,77,109,.12);color:#FF8FA3;border:1px solid rgba(255,77,109,.3)}
.errbox{color:#FF8FA3;font-size:13px;min-height:18px;margin:0 0 10px}
.urow{padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.center{min-height:100vh;display:flex;align-items:center;padding:20px}
.qrwrap{background:#fff;border-radius:16px;padding:12px;display:flex;justify-content:center;margin:10px 0}
.payqr{display:block;width:100%;max-width:280px;margin:0 auto;border-radius:14px;background:#fff;padding:8px}
.bubble{max-width:82%;padding:10px 12px;border-radius:16px;margin-bottom:8px;font-size:14px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap}
.bubble.me{margin-left:auto;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-bottom-right-radius:4px}
.bubble.them{background:var(--fill2);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble img{width:100%;border-radius:12px;margin-top:6px;display:block}
.bubble .who{font-size:11px;opacity:.75;margin-bottom:4px;font-weight:700}
.sys{text-align:center;font-size:12px;color:var(--mut);margin:10px 0}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.enter{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sk{height:96px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}

.band{background-size:200% 100%;animation:flow 3s linear infinite}

.iconbtn{position:relative}
.dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}

.sp-logo span{color:var(--cyan)}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px;border:0;background:transparent;color:inherit;font-family:inherit;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.setrow:last-child{border-bottom:0}

.fileBtn{position:relative;overflow:hidden}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- storage ----------
const MEM = {};
const load = (k, d) => {
  let raw = null;
  try { raw = localStorage.getItem(k); } catch (e) { raw = MEM[k] ?? null; }
  if (raw == null) return d;
  try { return JSON.parse(raw); } catch (e) { return d; }
};
const save = (k, v) => {
  const s = JSON.stringify(v);
  MEM[k] = s;
  try { localStorage.setItem(k, s); } catch (e) {}
  if (DB && CLOUD_READY[k]) { try { DB.ref('vx/' + k).set(s); } catch (e) {} }
};

// ---------- realtime sync (Firebase Realtime Database) ----------
const FB_CONFIG = {
  apiKey: "AIzaSyDct-TAfTqwQfkI5ThbNJtesCNdLUp75Lw",
  authDomain: "vortex-47757.firebaseapp.com",
  databaseURL: "https://vortex-47757-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vortex-47757",
  storageBucket: "vortex-47757.firebasestorage.app",
  messagingSenderId: "434824252904",
  appId: "1:434824252904:web:93399da8e12f2a55cda85d"
};
// Shared data goes to the cloud. Session and referral-used stay per device.
const CLOUD_KEYS = ['vx_users', 'vx_tournaments', 'vx_settings', 'vx_tickets', 'vx_notes', 'vx_withdraw'];
let LOADING = true;
const CLOUD_READY = {};
let DB = null;
try {
  if (window.firebase) {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    DB = firebase.database();
  }
} catch (e) { DB = null; }

let refreshTimer = null;
function refreshSoon() {
  const a = document.activeElement;
  // do not wipe a form the user is typing in; refresh once they leave the field
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) {
    a.addEventListener('blur', () => setTimeout(refreshSoon, 150), { once: true });
    return;
  }
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => render(), 50);
}

function startCloud() {
  if (!DB) { LOADING = false; return; } // no Firebase: app keeps working on this device only
  setTimeout(() => { if (LOADING) { LOADING = false; render(); } }, 2500);
  CLOUD_KEYS.forEach(k => {
    DB.ref('vx/' + k).on('value', snap => {
      const val = snap.val();
      if (val == null || typeof val !== 'string') {
        // cloud empty for this key: upload our local copy once
        if (!CLOUD_READY[k]) {
          CLOUD_READY[k] = true;
          if (MEM[k] != null) DB.ref('vx/' + k).set(MEM[k]);
        }
        return;
      }
      CLOUD_READY[k] = true;
      if (LOADING && CLOUD_KEYS.every(x => CLOUD_READY[x])) { LOADING = false; refreshSoon(); }
      if (val !== MEM[k]) {
        MEM[k] = val;
        try { localStorage.setItem(k, val); } catch (e) {}
        if (k === 'vx_users') ensureOwner();
        refreshSoon();
      }
    });
  });
}

}

const makeRefCode = (name, list) => {
  const CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rnd = n => Array.from({ length: n }, () => CH[Math.floor(Math.random() * CH.length)]).join('');
  let base = String(name || '').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 5);
  if (base.length < 5) base = (base + rnd(5)).slice(0, 5);
  let code;
  do { code = base + rnd(10); } while (list.some(u => u.ref === code));
  return code;
};

async function compress(file, maxSide = 900, quality = 0.72){
  let w, h, draw;
  try {
    // Modern decoder first (works for most phone photos)
    const bmp = await createImageBitmap(file);
    w = bmp.width; h = bmp.height;
    draw = c => c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  } catch (e) {
    // Fallback: read the file as a data URL and load it as an image
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('image')); i.src = url; });
    w = img.width; h = img.height;
    draw = c => c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  }
  const k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  draw(c);
  return c.toDataURL('image/jpeg', quality);
}

// Photos (chat, payment claims, QR, avatar, cover) are stored one per key under vx/imgs,
// so the ticket list stays small and can always be saved and synced.
const IMGS = {}, IMG_ASK = {};
function putImg(dataUrl){
  const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  IMGS[id] = dataUrl;
  try { localStorage.setItem('vximg_' + id, dataUrl); } catch (e) {}
  if (DB) { try { DB.ref('vx/imgs/' + id).set(dataUrl); } catch (e) {} }
  return 'img:' + id;
}
function imgSrc(v){
  if (!v || typeof v !== 'string') return '';
  if (!v.startsWith('img:')) return v; // photos saved inline before this change still work
  const id = v.slice(4);
  if (IMGS[id]) return IMGS[id];
  try { const s = localStorage.getItem('vximg_' + id); if (s) { IMGS[id] = s; return s; } } catch (e) {}
  if (DB && !IMG_ASK[id]) {
    IMG_ASK[id] = true;
    DB.ref('vx/imgs/' + id).once('value').then(snap => {
      if (typeof snap.val() === 'string') { IMGS[id] = snap.val(); refreshSoon(); }
    }).catch(() => {});
  }
  return '';
}

  return `<div class="center" style="width:100%"><div class="glass" style="text-align:center;padding:28px;width:100%">
    <div class="ttl" style="color:var(--red);font-size:18px">ACCOUNT BANNED</div>
    <p class="mut" style="margin:12px 0 18px">Your account has been banned by an admin. Contact the owner for help.</p>
    <button class="abtn" data-act="logout" style="width:100%;height:44px">Logout</button>
  </div></div>`;
}

function tCard(t, u, where = 'play'){
  const joined = t.players.includes(u.id);
  const full = t.players.length >= t.slots;
  const pct = Math.min(100, Math.round(t.players.length / t.slots * 100));
  const btn = joined ? `<button class="gbtn sm" disabled>JOINED</button>`
    : full ? `<button class="gbtn sm" disabled>FULL</button>`
    : `<button class="gbtn sm" data-act="join" data-id="${esc(t.id)}">JOIN</button>`;
  return `
  <div class="glass tc gm-${gKey(t.game)}">
    <div class="band"></div>
    <div class="in">
      <div class="row"><span class="tag">${esc(t.mode)} · ${esc(gameName(t.game, tServer(t)))}</span><span class="coinchip">${ICON.coin} ${Number(t.fee)||0}</span></div>
      <div class="ttl" style="font-size:17px;margin:12px 0 4px">${esc(t.title)}</div>
      <div class="mut">${esc(fmt(t.date))}</div>
      <div class="grid2" style="margin:12px 0 0">
        <div class="box"><span class="mut">Prize pool</span><b style="color:var(--gold)">${CUR()}${Number(t.prize).toLocaleString('en-IN')}</b></div>
        <div class="box"><span class="mut">Slots</span><b>${t.players.length} / ${t.slots}</b></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row"><span class="mut">${t.fee ? 'Entry '+t.fee+' coins' : 'Free entry'}</span>${btn}</div>
      ${where === 'matches' && joined ? matchInfo(t, u) : ''}
      ${cardTools(t, u, joined)}
    </div>
  </div>`;
}

function rosterList(t, viewer){
  const list = users();
  const rows = t.players.map((id, i) => {
    const p = list.find(x => x.id === id);
    const hidden = p && p.privacyHide && !isSupport(viewer) && id !== viewer.id;
    const nm = !p ? 'Unknown player' : hidden ? 'Private player' : p.name;
    return `<div class="ritem">${i + 1}. ${esc(nm)}</div>`;
  }).join('');
  return `<div class="glass" style="margin-top:12px;padding:12px 14px">${rows || '<div class="mut">No players yet.</div>'}</div>`;
}

function roomForm(t){
  const rl = roomLabels(t);
  return `<form id="roomForm" class="glass" style="margin-top:12px;padding:14px">
    <input type="hidden" name="tid" value="${esc(t.id)}">
    <label>${rl.id}</label>
    <input name="roomId" maxlength="40" value="${esc(t.roomId || '')}" placeholder="${rl.idPh}">
    <label>${rl.pass}</label>
    <input name="roomPass" maxlength="40" value="${esc(t.roomPass || '')}" placeholder="${rl.passPh}">
    <button class="gbtn sm" type="submit">SAVE ROOM DETAILS</button>
  </form>`;
}

function cardTools(t, u, joined){
  let out = '';
  if (t.rules) out += `<div class="glass" style="margin-top:12px;padding:12px 14px"><div class="ttl" style="font-size:12px">RULES</div><div class="mut" style="margin-top:6px;white-space:pre-wrap;color:var(--text2)">${esc(t.rules)}</div></div>`;
  if (t.result && t.result.winners.length) out += resultLine(t);
  if (joined || isSupport(u)) {
    out += `<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap;justify-content:flex-start">
      <button class="abtn" data-act="roster" data-id="${esc(t.id)}">${S.rosterId === t.id ? 'Hide players' : `Players (${t.players.length})`}</button>
    </div>`;
  }
  if (S.rosterId === t.id) out += rosterList(t, u);
  return out;
}

function matchInfo(t, u){
  const open = S.infoId === t.id;
  return `<div class="row" style="margin-top:12px"><button class="abtn" data-act="info" data-id="${esc(t.id)}">${open ? 'Hide info' : 'Info'}</button></div>` + (open ? roomBlock(t, u, true) : '');
}
function roomBlock(t, u, joined){
  const staff = isSupport(u);
  if (!joined && !staff) return '';
  const hasRoom = t.roomId || t.roomPass;
  if (!hasRoom) return joined ? `<div class="mut" style="margin-top:12px">Room ID and password will be posted here soon.</div>` : '';
  const rl = roomLabels(t);
  return `<div class="grid2" style="margin-top:12px">
    <div class="box"><span class="mut">${rl.id}</span><b>${esc(t.roomId) || '-'}</b></div>
    <div class="box"><span class="mut">${rl.pass}</span><b>${esc(t.roomPass) || '-'}</b></div>

}

function qa(icon, label, page){
  return `<button class="qa" data-act="nav" data-v="${page}"><span class="qc">${icon}</span><span>${label}</span></button>`;
}

function matchesView(u){
  const ts = load('vx_tournaments', []).filter(t => t.players.includes(u.id) && tServer(t) === curSrv());
  return `<h2 class="ttl">MY MATCHES</h2>` +
    (ts.length ? ts.map(t => tCard(t, u, 'matches')).join('') : '<div class="empty">You have not joined any tournament yet.</div>');

// ----- support tickets -----
function bubble(m, t, v, open){
  if (m.role === 'sys') return `<div class="sys">${esc(m.text)}</div>`;
  const staff = isSupport(v);
  const mine = staff ? m.role === 'staff' : m.role === 'user';
  const cls = 'bubble ' + (mine ? 'me' : 'them');
  const who = `<div class="who">${esc(m.role === 'staff' ? 'Vortex Admin' : m.name)}</div>`;
  if (m.type === 'text') return `<div class="${cls}">${who}${esc(m.text)}</div>`;
  if (m.type === 'img') return `<div class="${cls}">${who}<img src="${imgSrc(m.img)}" alt="screenshot"></div>`;
  if (m.type === 'claim') {
    const st = m.status === 'approved' ? '<span class="badge good">APPROVED</span>'
      : m.status === 'rejected' ? '<span class="badge bad">REJECTED</span>' : '<span class="badge warn">PENDING</span>';
    const btns = (staff && open && m.status === 'pending')
      ? `<div class="btns"><button class="abtn ok" data-act="claimok" data-tid="${t.id}" data-id="${m.id}">Approve</button><button class="abtn danger" data-act="claimno" data-tid="${t.id}" data-id="${m.id}">Reject</button></div>` : '';
    return `<div class="${cls}">${who}<div class="claim">
      <div class="row"><b>Coins claim: ${Number(m.amount)}</b>${st}</div>
      <div class="mut" style="margin-top:6px">Txn ID: ${esc(m.txn || '-')}</div>
      <img src="${imgSrc(m.img)}" alt="payment screenshot" style="width:100%;border-radius:12px;margin-top:8px;display:block">
      ${btns}
    </div></div>`;
  }
  return '';
}

function ticketRow(t){
  const pend = t.messages.filter(m => m.type === 'claim' && m.status === 'pending').length;
  const open = t.status === 'open';
  return `<button class="thread" data-act="open" data-id="${t.id}">
    <div style="min-width:0"><b>${esc(t.subject)}</b><div class="mut">${isSupport(me()) ? esc(t.userName) + ' · ' : ''}${esc(fmt(t.createdAt))}</div></div>
    <span style="display:flex;gap:6px;flex-shrink:0"><span class="badge ${open?'good':'bad'}">${open?'OPEN':'CLOSED'}</span>${pend ? `<span class="badge warn">${pend} PENDING</span>` : ''}</span>
  </button>`;
}

function newChatBox(u){
  const at = nextChatAt(u.id);
  if (at > Date.now()) return `<div class="note err">You can open only one ticket every 2 days. Next ticket: ${esc(fmt(at))}.</div>`;
  if (!S.newOpen) return `<button class="gbtn" data-act="newopen" style="margin-bottom:14px">+ NEW CHAT</button>`;
  return `<form id="newForm" class="glass">
    <div class="ttl" style="font-size:14px;margin-bottom:10px">NEW TICKET</div>
    <label>Subject</label>
    <input name="subject" required maxlength="60" value="${esc(S.newPreset || '')}" placeholder="e.g. Coins not received">
    <label>Message (optional)</label>
    <textarea name="msg" rows="3" maxlength="500"></textarea>
    <button class="gbtn" type="submit">CREATE TICKET</button>
    <button class="abtn" type="button" data-act="newcancel" style="width:100%;margin-top:8px">Cancel</button>
  </form>`;
}

function claimFormView(){
  return `<h2 class="ttl">COINS CLAIM</h2>
  <div class="glass">
    <div class="ttl" style="font-size:14px;margin-bottom:10px">${Number(S.claimAmt)} COINS</div>
    <form id="claimForm">
      <label>UPI / Transaction ID (optional)</label>
      <input name="txn" maxlength="40" placeholder="Transaction ID">
      <label>Payment screenshot (zaroori)</label>
      <input name="img" type="file" accept="image/*" required>
      <button class="gbtn" type="submit">SUBMIT CLAIM</button>
    </form>
    <button class="abtn" data-act="claimcancel" style="width:100%;margin-top:8px">Cancel</button>
  </div>`;
}

function ticketView(u, tid){
  const t = getTix().find(x => x.id === tid);
  const staff = isSupport(u);
  if (!t || (!staff && t.userId !== u.id)) { S.ticketId = null; return chatView(u); }
  const open = t.status === 'open';
  const head = `<div class="row" style="margin-bottom:10px"><button class="abtn" data-act="tkback">← Back</button>${isAdmin(u) && open ? `<button class="abtn danger" data-act="close" data-id="${t.id}">Close ticket</button>` : ''}</div>
    <div class="glass" style="padding:14px 16px;margin-bottom:12px"><b>${esc(t.subject)}</b>
    <div class="mut" style="margin-top:4px">${staff ? esc(t.userName) + ' · ' : ''}<span class="badge ${open?'good':'bad'}">${open?'OPEN':'CLOSED'}</span></div></div>`;
  const msgs = t.messages.length ? t.messages.map(m => bubble(m, t, u, open)).join('') : '<div class="empty">No messages yet.</div>';
  const dr = DRAFT.tid === t.id ? DRAFT : { text: '', img: null };
  const typingLine = `<div id="typingLine" class="mut" style="font-size:12px;padding:8px 4px;min-height:24px"></div>`;
  const composer = open
    ? `${typingLine}<div class="emojibar">${EMOJIS.map(e => `<button type="button" data-act="emoji" data-v="${e}">${e}</button>`).join('')}</div><form id="chatForm" class="glass" style="margin-top:4px">
        <input type="hidden" name="tid" value="${t.id}">
        ${dr.img ? `<div class="row" style="margin-bottom:8px"><span class="badge good">PHOTO READY</span><button type="button" class="abtn" data-act="clearimg">Remove</button></div>` : ''}
        <textarea name="msg" rows="2" maxlength="500" placeholder="Type a message...">${esc(dr.text)}</textarea>
        <div class="row" style="gap:8px">
          <label class="abtn fileBtn" style="margin:0">Photo<input name="img" type="file" accept="image/*"></label>
          <button class="gbtn sm" type="submit">Send</button>
        </div>
      </form>`
    : '<div class="note err" style="margin-top:12px">This ticket is closed.</div>';
  return head + msgs + composer;
}

function chatView(u){
  if (S.claimOpen) return claimFormView();
  if (S.ticketId) return ticketView(u, S.ticketId);
  const staff = isSupport(u);
  const list = getTix().filter(t => staff || t.userId === u.id)
    .sort((a, b) => ((a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1)) || b.createdAt.localeCompare(a.createdAt));
  return `<h2 class="ttl">${staff ? 'ALL TICKETS' : 'SUPPORT'}</h2>`
    + (staff ? '' : supportTools() + newChatBox(u))
    + (list.length ? list.map(ticketRow).join('') : '<div class="empty">No tickets yet.</div>');
}

// ----- wallet -----
function walletBox(u){
  const s = getSet();
  const srv = curSrv();
  const isIn = srv === 'india';
  const apps = payApps(srv);
  // Default to the first app that already has a QR
  const hasQr = x => imgSrc((s.qr || {})[qrKey(srv, x.k)]) || DEFAULT_QR[qrKey(srv, x.k)];
  const curApp = apps.length ? (apps.some(x => x.k === S.payApp) ? S.payApp : (apps.find(hasQr) || apps[0]).k) : null;
  const appLabel = curApp ? apps.find(x => x.k === curApp).l : SERVERS[srv].label;
  const key = qrKey(srv, curApp);
  // Each app has its own QR. India also falls back to the built-in QR.
  const qrSrc = imgSrc((s.qr || {})[key]) || DEFAULT_QR[key] || (isIn ? PAYQR : '');
  const appSeg = apps.length ? `<div class="seg" style="margin-bottom:12px">${apps.map(x => `<button data-act="payapp" data-v="${x.k}" class="${x.k === curApp ? 'on' : ''}">${x.l}</button>`).join('')}</div>` : '';
  const payQR = `${appSeg}<div class="glass" style="text-align:center">
    <div class="ttl" style="font-size:14px;margin-bottom:10px">PAYMENT QR${curApp ? ' · ' + appLabel.toUpperCase() : ''}</div>
    ${qrSrc ? `<img class="payqr" src="${qrSrc}" alt="Payment QR">` : `<div class="mut">Admin has not uploaded the ${appLabel} QR yet.</div>`}
    <div class="mut" style="margin-top:8px">Scan the QR to pay, then tap Claim.</div>
  </div>`;
  if (isIn && !s.upiId) return payQR + `<div class="note err">Admin has not set a UPI ID yet.</div>`;
  const qr = S.qrAmt ? `
    <div class="glass">
      <div class="ttl" style="font-size:14px">PAY ${CUR()}${S.qrAmt} = ${S.qrAmt} COINS</div>
      <div class="mut" style="margin-top:4px">1 coin = ${CUR()}1. ${isIn ? 'Scan the QR or tap Pay.' : 'Scan the QR above and pay this amount.'}</div>
      ${isIn ? `<div class="qrwrap"><div id="qrbox"></div></div>
      <div class="grid2" style="margin-bottom:10px">
        <button class="abtn" data-act="dlqr">Download QR</button>
        <a class="abtn" href="${esc(upiLink(S.qrAmt))}">Pay via UPI</a>
      </div>` : ''}
      <button class="gbtn" data-act="claim">Paid? Claim Coins</button>
    </div>` : '';
  return payQR + `
    <div class="glass">
      <div class="ttl" style="font-size:14px;margin-bottom:10px">ADD COINS</div>
      <label>Amount (10 to 1,00,000)</label>
      <div class="row" style="gap:8px;flex-wrap:nowrap">
        <input id="amt" type="number" min="10" max="100000" value="${S.qrAmt || 100}" style="margin:0">
        <button class="gbtn sm" data-act="addcoins">Add</button>
      </div>
    </div>${qr}`;
}

// ---------- unique Vortex ID ----------
function genVid(list){ let v; do { v = 'VX' + (100000 + Math.floor(Math.random() * 899999)); } while (list.some(x => x.vid === v)); return v; }
function ensureVid(u){
  if (!u || u.vid) return u;
  const list = users(); const p = list.find(x => x.id === u.id); if (!p) return u;
  p.vid = genVid(list); save('vx_users', list); return p;
}

// ---------- notifications (notification center) ----------
const notesAll = () => load('vx_notes', []);
const myNotes = u => notesAll().filter(n => n.to === 'all' ? (n.server || 'india') === srvOf(u) : n.to === u.id);
const unreadCount = u => myNotes(u).filter(n => !(n.readBy || []).includes(u.id)).length;
function addNote(to, title, text, srv){
  const list = notesAll();
  list.unshift({ id: msgId(), to, title, text, at: new Date().toISOString(), readBy: [], server: srv || curSrv() });
  save('vx_notes', list.slice(0, 300));
}
function markNotesRead(u){
  const list = notesAll();
  list.forEach(n => { if ((n.to === 'all' || n.to === u.id) && !(n.readBy || []).includes(u.id)) n.readBy = [...(n.readBy || []), u.id]; });
  save('vx_notes', list);
}
function checkAlerts(){
  const u = me(); if (!u) return;
  const seen = load('vx_alerted', {}); const now = Date.now(); let changed = false;
  allTours().forEach(t => {
    if (!t.players.includes(u.id)) return;
    const d = new Date(t.date).getTime() - now; const key = t.id + ':' + u.id;
    if (!seen[key] && d > 0 && d <= 30 * 60000) { seen[key] = true; changed = true; addNote(u.id, 'Match starting soon', `${t.title} starts at ${fmt(t.date)}`); }
  });
  if (changed) { save('vx_alerted', seen); refreshSoon(); }
}

// ---------- tournaments, results and stats ----------
const allTours = () => load('vx_tournaments', []);
const wdAll = () => load('vx_withdraw', []);
const wdOf = (uid, status, srv) => wdAll().filter(w => w.userId === uid && w.status === status && (!srv || (w.server || 'india') === srv)).reduce((s, w) => s + (Number(w.amount) || 0), 0);
function userStats(u){
  const srv = srvOf(u);
  const ts = allTours().filter(t => tServer(t) === srv);
  const joined = ts.filter(t => t.players.includes(u.id));
  let wins = 0, earned = 0;
  ts.forEach(t => ((t.result && t.result.winners) || []).forEach(w => {
    if (w.uid !== u.id) return;
    earned += Number(w.prize) || 0; if (w.pos === 1) wins++;
  }));
  const withdrawn = wdOf(u.id, 'paid', srv), pending = wdOf(u.id, 'pending', srv);
  const adj = Number((u.winAdj || {})[srv]) || 0;
  return { matches: joined.length, wins, earned, winRate: joined.length ? Math.round(wins / joined.length * 100) : 0,
    winnings: earned - withdrawn - pending + adj, withdrawn, pending, joined };
}
function resultForm(t){
  const list = users();
  const names = t.players.map(id => { const p = list.find(x => x.id === id); return { id, name: p ? p.name : 'Unknown' }; });
  const prev = (t.result && t.result.winners) || [];
  const row = pos => {
    const w = prev.find(x => x.pos === pos) || {};
    return `<div class="grid2"><div><label>Place ${pos}</label><select name="uid${pos}"><option value="">-</option>${names.map(n => `<option value="${esc(n.id)}" ${w.uid === n.id ? 'selected' : ''}>${esc(n.name)}</option>`).join('')}</select></div>
      <div><label>Prize (${CUR()})</label><input name="prize${pos}" type="number" min="0" value="${Number(w.prize) || 0}"></div></div>`;
  };
  return `<form id="resultForm" class="glass" style="margin-top:12px;padding:14px"><input type="hidden" name="tid" value="${esc(t.id)}">
    <div class="ttl" style="font-size:13px;margin-bottom:8px">RESULT · ${esc(t.title)}</div>
    ${row(1)}${row(2)}${row(3)}
    <button class="gbtn sm" type="submit">SAVE RESULT</button></form>`;
}
function saveResult(f){
  const u = me(); if (!isAdmin(u)) return;
  const ts = allTours(); const t = ts.find(x => x.id === f.elements.tid.value); if (!t) return;
  const winners = [1, 2, 3].map(pos => ({ pos, uid: f.elements['uid' + pos].value, prize: Math.max(0, Math.floor(Number(f.elements['prize' + pos].value) || 0)) })).filter(w => w.uid);
  if (!winners.length) return flash('Pick at least one winner.', 'err');
  t.result = { at: new Date().toISOString(), winners };
  save('vx_tournaments', ts);
  winners.forEach(w => addNote(w.uid, 'You won!', `${t.title} · place ${w.pos} · ${CUR()}${w.prize}`));
  addNote('all', 'Winners announced', `${t.title} results are out.`);
  S.resultId = null; flash('Result saved.');
}
function resultLine(t){
  const list = users();
  const txt = t.result.winners.slice().sort((a, b) => a.pos - b.pos).map(w => {
    const p = list.find(x => x.id === w.uid);
    return `${w.pos}. ${esc(p ? p.name : 'Player')} · ${CUR()}${w.prize}`;
  }).join('<br>');
  return `<div class="glass" style="margin-top:12px;padding:12px 14px"><div class="ttl" style="font-size:12px">WINNERS</div><div style="margin-top:6px;font-size:14px;line-height:1.7">${txt}</div></div>`;
}

// ---------- withdrawals (manual payout by admin) ----------
function wdLabel(srv){ return srv === 'pakistan' ? 'Your EasyPaisa or JazzCash number' : srv === 'nepal' ? 'Your eSewa or Khalti ID' : 'Your UPI ID'; }
function wdPh(srv){ return srv === 'pakistan' ? '03XX XXXXXXX' : srv === 'nepal' ? 'eSewa or Khalti ID' : 'name@upi'; }
function wdForm(u, s){
  return `<div class="glass"><div class="ttl" style="font-size:14px;margin-bottom:10px">WITHDRAW WINNINGS</div>
    <form id="wdForm"><label>Amount (min ${CUR()}50 · available ${CUR()}${s.winnings})</label>
      <input name="amount" type="number" min="50" value="${s.winnings >= 50 ? s.winnings : 50}">
      <label>${wdLabel(srvOf(u))}</label><input name="upi" maxlength="60" placeholder="${wdPh(srvOf(u))}">
      <button class="gbtn" type="submit">REQUEST WITHDRAWAL</button></form></div>`;
}
function wdRequest(f){
  const u = me(); if (!u) return;
  const amt = Math.floor(Number(f.elements.amount.value) || 0);
  const upi = String(f.elements.upi.value || '').trim();
  const s = userStats(u);
  if (amt < 50) return flash('Minimum withdrawal is ' + CUR() + '50.', 'err');
  if (amt > s.winnings) return flash('Not enough winning balance.', 'err');
  if (!upi) return flash('Enter your UPI ID.', 'err');
  const list = wdAll();
  list.unshift({ id: msgId(), userId: u.id, userName: u.name, server: srvOf(u), amount: amt, upi, status: 'pending', at: new Date().toISOString() });
  save('vx_withdraw', list);
  flash('Withdrawal request sent. Admin will pay it manually.');
}
function wdDecide(id, ok){
  const staff = me(); if (!isAdmin(staff)) return;
  const list = wdAll(); const w = list.find(x => x.id === id); if (!w || w.status !== 'pending') return;
  w.status = ok ? 'paid' : 'rejected'; w.decidedBy = staff.name; w.decidedAt = new Date().toISOString();
  save('vx_withdraw', list);
  addNote(w.userId, ok ? 'Withdrawal paid' : 'Withdrawal rejected', `${CUR()}${w.amount} to ${w.upi}`);
  flash(ok ? 'Marked as paid.' : 'Request rejected.', ok ? 'ok' : 'err');
}
function wdPanel(){
  const list = wdAll().filter(w => (w.server || 'india') === curSrv());
  return `<h2 class="ttl" style="font-size:14px;margin-top:16px">WITHDRAWAL REQUESTS</h2>` + (list.length ? list.map(w => `<div class="glass row">
      <div><b>${esc(w.userName)} · ${curOf(w.server || 'india')}${Number(w.amount)}</b><div class="mut">${esc(SERVERS[w.server || 'india'].label)} · ${esc(w.upi)} · ${esc(fmt(w.at))}</div></div>
      ${w.status === 'pending'
        ? `<div class="row" style="gap:6px"><button class="abtn ok" data-act="wdpaid" data-id="${esc(w.id)}">Mark paid</button><button class="abtn danger" data-act="wdno" data-id="${esc(w.id)}">Reject</button></div>`
        : `<span class="badge ${w.status === 'paid' ? 'good' : 'bad'}">${esc(w.status.toUpperCase())}</span>`}
    </div>`).join('') : '<div class="empty">No withdrawal requests.</div>');
}

// ---------- leaderboard ----------
function boardView(u){
  const range = S.boardRange || 'all', sortBy = S.boardSort || 'wins';
  const now = Date.now();
  const cutoff = range === 'week' ? now - 7 * 864e5 : range === 'month' ? now - 30 * 864e5 : 0;
  const rows = {};
  users().filter(x => x.role !== 'owner' && srvOf(x) === curSrv()).forEach(x => rows[x.id] = { u: x, wins: 0, earned: 0, matches: 0 });
  allTours().filter(t => tServer(t) === curSrv()).forEach(t => t.players.forEach(id => { if (rows[id]) rows[id].matches++; }));
  allTours().filter(t => tServer(t) === curSrv() && t.result && new Date(t.result.at).getTime() >= cutoff).forEach(t => t.result.winners.forEach(w => {
    const r = rows[w.uid]; if (!r) return;
    r.earned += Number(w.prize) || 0; if (w.pos === 1) r.wins++;
  }));
  const list = Object.values(rows).filter(r => r.wins || r.earned)
    .sort((a, b) => sortBy === 'earn' ? (b.earned - a.earned) || (b.wins - a.wins) : (b.wins - a.wins) || (b.earned - a.earned)).slice(0, 20);
  const seg = (items, cur, act) => items.map(([k, l]) => `<button data-act="${act}" data-v="${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('');
  const nameOf = r => (r.u.privacyHide && r.u.id !== u.id && !isSupport(u)) ? 'Private player' : r.u.name;
  return `<h2 class="ttl">${T('leaderboard')}</h2>
    <div class="seg">${seg([['all', 'All time'], ['month', 'Monthly'], ['week', 'Weekly']], range, 'boardrange')}</div>
    <div class="seg">${seg([['wins', 'Most wins'], ['earn', 'Highest earnings']], sortBy, 'boardsort')}</div>
    ${list.length ? list.map((r, i) => `<div class="glass row" style="padding:12px 14px">
      <div><b>${i + 1}. ${esc(nameOf(r))}</b><div class="mut">${r.wins} wins · ${r.matches} matches · ${CUR()}${r.earned}</div></div>
      ${i === 0 ? '<span class="badge warn">TOP</span>' : ''}</div>`).join('') : '<div class="empty">No results yet. Winners will show here.</div>'}`;
}

function fx(){
  const p = getPrefs().fx || {};
  if (p.haptic && navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  if (p.sound) {
    try {
      const C = window.AudioContext || window.webkitAudioContext; const c = new C();
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = 0.04; o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + 0.05);
    } catch (e) {}
  }
}

// ---------- actions ----------
function authSubmit(f){
  const d = Object.fromEntries(new FormData(f));
  const email = String(d.email || '').trim().toLowerCase();
  const pass = String(d.password || '');
  const srv = SERVERS[d.server] ? d.server : 'india';
  AUTH_SRV = srv;
  const list = users();
  const setErr = m => { const e = $('#err'); if (e) e.textContent = m; };

  if (S.tab === 'register') {
    if (list.some(u => u.email === email)) return setErr('This email is already registered. Please log in.');
    const code = String(d.ref || '').trim().toUpperCase();
    let referrer = null, note = '';
    if (code) {
      if (load('vx_ref_used', false)) note = 'A referral was already used on this device, so the code was not applied.';
      else {
        referrer = list.find(x => x.ref === code);
        if (!referrer) return setErr('Invalid referral code.');
      }
    }
    const bonus = referrer ? 5 : 0;
    const u = { id:'u_' + Date.now().toString(36), name:String(d.name||'').trim(), email, password:pass, role:'player',
      coinsBy:{ [srv]: bonus }, banned:false, ref:null, referredBy: referrer ? referrer.id : null, server: srv };
    if (referrer) setCoinsOf(referrer, srvOf(referrer), coinsOf(referrer) + 5);
    list.push(u);
    save('vx_users', list);
    if (referrer) save('vx_ref_used', true);
    save('vx_session', u.id);
    S.page = 'play';
    S.flash = referrer ? { m:'Referral applied! You received 5 coins.', t:'ok' } : (note ? { m:note, t:'err' } : null);
  } else {
    const u = list.find(x => x.email === email && x.password === pass);
    if (!u) return setErr('Wrong email or password.');
    if (u.server !== srv) { u.server = srv; save('vx_users', list); }
    save('vx_session', u.id);
    S.page = 'play';
  }
  render();
}

function joinT(id){
  const u = me(); if (!u) return;
  const ts = load('vx_tournaments', []);
  const t = ts.find(x => x.id === id);
  if (!t || t.players.includes(u.id)) return;
  if (t.players.length >= t.slots) return flash('Slots are full.', 'err');
  const list = users();
  const p = list.find(x => x.id === u.id);
  if (coinsOf(p) < (Number(t.fee) || 0)) return flash(`Not enough coins. Entry is ${t.fee} coins.`, 'err');
  setCoinsOf(p, srvOf(p), coinsOf(p) - (Number(t.fee) || 0));
  t.players.push(u.id);
  save('vx_users', list);
  save('vx_tournaments', ts);
  flash('Joined the tournament!');
}

function tournamentFields(d){
  return {
    title: String(d.title || '').trim(), game: gKey(d.game) || 'FF', server: SERVERS[d.server] ? d.server : 'india', mode: d.mode, date: d.date,
    fee: Math.max(0, Math.floor(Number(d.fee) || 0)), prize: Number(d.prize) || 0,
    slots: Math.max(2, Number(d.slots) || 2),
    roomId: String(d.roomId || '').trim().slice(0, 40), roomPass: String(d.roomPass || '').trim().slice(0, 40),
    rules: String(d.rules || '').trim().slice(0, 600)
  };
}

function saveTournament(f){
  const u = me(); if (!isAdmin(u)) return;
  const d = Object.fromEntries(new FormData(f));
  const fields = tournamentFields(d);
  const ts = load('vx_tournaments', []);
  if (S.editId) {
    const t = ts.find(x => x.id === S.editId);
    if (!t || (u.role !== 'owner' && t.createdBy !== u.id)) return flash('You cannot edit this tournament.', 'err');
    if (fields.slots < t.players.length) return flash(`Slots cannot be less than ${t.players.length}.`, 'err');
    Object.assign(t, fields);
    S.editId = null;
    save('vx_tournaments', ts);
    return flash('Tournament updated.');
  }
  ts.unshift({ id:'t_' + Date.now().toString(36), ...fields, players:[], createdBy:u.id });
  save('vx_tournaments', ts);
  addNote('all', 'New tournament', `${fields.title} · ${gameName(fields.game, fields.server)}`, fields.server);
  flash('Tournament published.');
}

function delT(id){
  const u = me(); if (!isAdmin(u)) return;
  const ts = load('vx_tournaments', []);
  const t = ts.find(x => x.id === id);
  if (!t || (u.role !== 'owner' && t.createdBy !== u.id)) return;
  save('vx_tournaments', ts.filter(x => x.id !== id));
  flash('Tournament deleted.');
}

function setRole(id, role){
  const u = me(); if (!isAdmin(u)) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || t.id === u.id) return;
  if (u.role !== 'owner' && t.role === 'owner') return;
  const allowed = u.role === 'owner' ? ['player', 'staff', 'admin', 'owner'] : ['player', 'staff'];
  if (!allowed.includes(role)) return;
  if (u.role === 'admin' && !['player', 'staff'].includes(t.role)) return;
  t.role = role;
  save('vx_users', list);
  flash(`${t.name} is now ${roleLabel(t.role)}.`);
}

function toggleBan(id){
  const u = me(); if (!u) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || !canManage(u, t)) return;
  t.banned = !t.banned;
  save('vx_users', list);
  flash(`${t.name} ${t.banned ? 'has been banned' : 'has been unbanned'}.`, t.banned ? 'err' : 'ok');
}

function setCoins(id, mode = 'set'){
  const u = me(); if (!u) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || !canManage(u, t)) return;
  const v = document.getElementById('c_' + id);
  const n = Math.max(0, Math.floor(Number(v && v.value) || 0));
  const cur = coinsOf(t);
  const next = mode === 'add' ? cur + n : mode === 'remove' ? Math.max(0, cur - n) : n;
  setCoinsOf(t, srvOf(t), next);
  save('vx_users', list);
  flash(`${t.name}'s coins are now ${next}.`);
}
// Winning balance is earned from results. Admin can set, add or remove it with a manual adjustment per server.
function winAdjust(id, mode){
  const u = me(); if (!isAdmin(u)) return;
  const list = users();
  const t = list.find(x => x.id === id);
  if (!t || !canManage(u, t)) return;
  const v = document.getElementById('w_' + id);
  const n = Math.max(0, Math.floor(Number(v && v.value) || 0));
  const srv = srvOf(t);
  const adj = Number((t.winAdj || {})[srv]) || 0;
  const base = userStats(t).winnings - adj;
  let next;
  if (mode === 'set') next = n - base;
  else if (mode === 'add') next = adj + n;
  else next = Math.max(adj - n, -base);
  t.winAdj = { ...(t.winAdj || {}), [srv]: next };
  save('vx_users', list);
  const now = userStats(t).winnings;
  addNote(t.id, 'Winning balance updated', `Your winning balance is now ${curOf(srv)}${now}.`, srv);
  flash(`${t.name}'s winning balance is now ${curOf(srv)}${now}.`);
}

function selfCoins(mode){
  const u = me(); if (!isAdmin(u)) return;
  const v = Math.floor(Number(document.getElementById('c_self').value));
  if (!(v >= 0) || (mode === 'add' && v === 0)) return flash('Enter a valid amount.', 'err');
  const list = users();
  const p = list.find(x => x.id === u.id);
  setCoinsOf(p, srvOf(p), mode === 'add' ? coinsOf(p) + v : v);
  save('vx_users', list);
  flash(mode === 'add' ? `${v} coins added.` : `Coins set to ${v}.`);
}

function addCoinsStart(){
  const s = getSet();
  if (curSrv() === 'india' && !s.upiId) return flash('Admin has not set a UPI ID yet.', 'err');
  const v = Math.floor(Number(document.getElementById('amt').value));
  if (!(v >= 10 && v <= 100000)) return flash('Enter an amount between 10 and 1,00,000.', 'err');
  S.qrAmt = v;
  S.claimOpen = false;
  render();
}

function savePaySettings(f){
  const d = Object.fromEntries(new FormData(f));
  save('vx_settings', { ...getSet(), upiId: String(d.upiId||'').trim(), upiName: String(d.upiName||'').trim() || 'Vortex Esport' });
  flash('Payment settings saved.');
}
async function saveQr(f){
  const u = me(); if (!isAdmin(u)) return;
  const file = f.elements.qrimg.files[0];
  if (!file) return flash('Choose a QR image.', 'err');
  const key = String(f.elements.srv.value || '');
  if (!SERVERS[key.split(':')[0]]) return flash('Choose a server.', 'err');
  let img;
  try { img = putImg(await compress(file, 800, 0.9)); } catch (e) { return flash('Could not load the QR image.', 'err'); }
  const s = getSet();
  s.qr = { ...(s.qr || {}), [key]: img };
  save('vx_settings', s);
  flash('QR saved.');
}

function newSubmit(f){
  const u = me(); if (!u) return;
  const d = new FormData(f);
  const subject = String(d.get('subject') || '').trim();
  const text = String(d.get('msg') || '').trim();
  if (!subject) return flash('Please enter a subject.', 'err');
  if (nextChatAt(u.id) > Date.now()) return flash('You can open only one ticket every 2 days.', 'err');
  const tid = 'tk' + Date.now().toString(36);
  const messages = text ? [{ id: msgId(), role:'user', name:u.name, type:'text', text, at:new Date().toISOString() }] : [];
  const t = getTix();
  t.unshift({ id:tid, userId:u.id, userName:u.name, server: srvOf(u), subject, kind:'chat', status:'open', createdAt:new Date().toISOString(), messages });
  saveTix(t);
  S.newOpen = false;
  S.ticketId = tid;
  flash('Ticket created.');
}

async function claimSubmit(f){
  const u = me(); if (!u) return;
  const d = new FormData(f);
  const file = d.get('img');
  if (!file || !file.size) return flash('Screenshot is required.', 'err');
  let shot;
  try { shot = await compress(file); } catch (e) { return flash('Could not load the screenshot.', 'err'); }
  const tid = 'tk' + Date.now().toString(36);
  const t = getTix();
  t.unshift({ id:tid, userId:u.id, userName:u.name, server: srvOf(u), subject:`Coins claim: ${S.claimAmt} coins`, kind:'claim', status:'open', createdAt:new Date().toISOString(),
    messages:[{ id:msgId(), role:'user', name:u.name, type:'claim', amount:S.claimAmt, txn:String(d.get('txn')||'').trim(), img:putImg(shot), status:'pending', at:new Date().toISOString() }] });
  saveTix(t);
  S.claimOpen = false; S.qrAmt = 0; S.claimAmt = 0; S.ticketId = tid;
  flash('Claim sent. Admin will verify it and add the coins.');
}

async function chatSubmit(f){
  const u = me(); if (!u) return;
  const tid = f.elements.tid.value;
  const t = getTix().find(x => x.id === tid);
  if (!t || t.status !== 'open') return flash('This ticket is closed.', 'err');
  const staff = isSupport(u);
  if (!staff && t.userId !== u.id) return;
  const text = String(f.elements.msg.value || '').trim();
  const img = DRAFT.tid === tid ? DRAFT.img : null;
  if (!text && !img) return;
  const role = staff ? 'staff' : 'user';
  if (text) addMsg(tid, { role, name:u.name, type:'text', text });
  if (img) addMsg(tid, { role, name:u.name, type:'img', img });
  DRAFT = { tid: null, text: '', img: null };
  stopTyping(tid);
  render();
}

function closeTicket(tid){
  const u = me(); if (!isAdmin(u)) return;
  const t = getTix(); const tk = t.find(x => x.id === tid);
  if (!tk || tk.status !== 'open') return;
  tk.status = 'closed'; tk.closedBy = u.name;
  saveTix(t);
  addMsg(tid, { role:'sys', type:'sys', text:`Ticket closed by ${u.name}.` });
  flash('Ticket closed.');
}

function decideClaim(tid, mid, ok){
  const staff = me(); if (!isAdmin(staff)) return;
  const t = getTix(); const tk = t.find(x => x.id === tid);
  if (!tk || tk.status !== 'open') return;
  const m = tk.messages.find(x => x.id === mid);
  if (!m || m.status !== 'pending') return;
  if (ok) {
    const list = users(); const p = list.find(x => x.id === tk.userId);
    if (p) { setCoinsOf(p, srvOf(p), coinsOf(p) + Number(m.amount)); save('vx_users', list); }
  }
  m.status = ok ? 'approved' : 'rejected';
  m.decidedBy = staff.name;
  saveTix(t);
  addMsg(tid, { role:'sys', type:'sys', text: ok ? `${m.amount} coins have been added to your account.` : 'Claim was rejected.' });
  addNote(tk.userId, ok ? 'Coins added' : 'Claim rejected', ok ? `${m.amount} coins added to your account.` : 'Your coins claim was rejected.');
  flash(ok ? 'Coins added.' : 'Claim rejected.', ok ? 'ok' : 'err');
}

// ---------- events ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  fx();
  if (a === 'tab') { S.tab = el.dataset.v; render(); }
  else if (a === 'nav') {
    S.page = el.dataset.v;
    S.claimOpen = false; S.ticketId = null; S.newOpen = false;
    render();
  }
  else if (a === 'sub') { S.sub = el.dataset.v; render(); }
  else if (a === 'game') { S.game = el.dataset.v; render(); }
  else if (a === 'srv') { AUTH_SRV = el.dataset.v; render(); }
  else if (a === 'payapp') { S.payApp = el.dataset.v; render(); }
  else if (a === 'join') joinT(el.dataset.id);
  else if (a === 'edit') { S.editId = el.dataset.id; S.sub = 'tour'; render(); }
  else if (a === 'canceledit') { S.editId = null; render(); }
  else if (a === 'del') delT(el.dataset.id);
  else if (a === 'ban') toggleBan(el.dataset.id);
  else if (a === 'coins') setCoins(el.dataset.id, el.dataset.v || 'set');
  else if (a === 'selfcoins') selfCoins(el.dataset.v);
  else if (a === 'addcoins') addCoinsStart();
  else if (a === 'genref') generateRef();
  else if (a === 'notesopen') { const u = me(); if (!u) return; S.unreadIds = myNotes(u).filter(n => !(n.readBy || []).includes(u.id)).map(n => n.id); markNotesRead(u); S.page = 'notes'; render(); }
  else if (a === 'boardrange') { S.boardRange = el.dataset.v; render(); }
  else if (a === 'boardsort') { S.boardSort = el.dataset.v; render(); }
  else if (a === 'presetnew') { S.newOpen = true; S.newPreset = el.dataset.v; render(); }
  else if (a === 'result') { S.resultId = S.resultId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'wdpaid') wdDecide(el.dataset.id, true);
  else if (a === 'wdno') wdDecide(el.dataset.id, false);
  else if (a === 'settings') { S.page = 'settings'; S.settingsSub = null; render(); }
  else if (a === 'setsub') { S.settingsSub = el.dataset.v || null; render(); }
  else if (a === 'roster') { S.rosterId = S.rosterId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'roomedit') { S.roomEditId = S.roomEditId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'info') { S.infoId = S.infoId === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === 'winadj') winAdjust(el.dataset.id, el.dataset.v);
  else if (a === 'emoji') insertEmoji(el.dataset.v);
  else if (a === 'theme') { if (curSrv() !== 'india') return flash('Theme is set by your server.', 'err'); const p = getPrefs(); p.theme = el.dataset.v; savePrefs(p); applyPrefs(); render(); }
  else if (a === 'color') { if (curSrv() !== 'india') return flash('Color is set by your server.', 'err'); const p = getPrefs(); p.color = el.dataset.v; savePrefs(p); applyPrefs(); render(); }
  else if (a === 'copyref') {
    const u = me();
    const txt = u && u.ref;
    try { navigator.clipboard.writeText(txt); flash('Code copied: ' + txt); } catch (err) { flash('Code: ' + txt); }
  }
  else if (a === 'dlqr') {
    const c = document.querySelector('#qrbox canvas');
    if (!c) return flash('QR is not ready yet.', 'err');
    const link = document.createElement('a');
    link.href = c.toDataURL('image/png');
    link.download = 'vortex-qr-' + S.qrAmt + '.png';
    link.click();
  }
  else if (a === 'claim') { S.claimAmt = S.qrAmt; S.claimOpen = true; S.page = 'chat'; S.ticketId = null; render(); }
  else if (a === 'claimcancel') { S.claimOpen = false; render(); }
  else if (a === 'newopen') { S.newOpen = true; render(); }
  else if (a === 'newcancel') { S.newOpen = false; render(); }
  else if (a === 'open') { S.ticketId = el.dataset.id; render(); }
  else if (a === 'tkback') { S.ticketId = null; render(); }
  else if (a === 'clearimg') { DRAFT.img = null; render(); }
  else if (a === 'close') closeTicket(el.dataset.id);
  else if (a === 'claimok') decideClaim(el.dataset.tid, el.dataset.id, true);
  else if (a === 'claimno') decideClaim(el.dataset.tid, el.dataset.id, false);
  else if (a === 'logout') { save('vx_session', null); S.page = 'play'; S.tab = 'login'; S.qrAmt = 0; S.claimOpen = false; S.ticketId = null; render(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset && el.dataset.act === 'role') setRole(el.dataset.id, el.value);
  const me0 = me();
  if (me0 && (el.name === 'avatar' || el.name === 'cover') && el.form && el.form.id === 'profileForm' && el.files && el.files[0]) {
    try {
      const img = putImg(await compress(el.files[0], el.name === 'avatar' ? 320 : 900, 0.8));
      const list = users(); const p = list.find(x => x.id === me0.id);
      if (p) { p[el.name] = img; save('vx_users', list); }
    } catch (err) { return flash('Could not load the photo.', 'err'); }
    return flash(el.name === 'avatar' ? 'Profile picture updated.' : 'Cover photo updated.');
  }
  if (me0 && el.dataset && el.dataset.act === 'hideme') {
    const list = users(); const p = list.find(x => x.id === me0.id);
    if (p) { p.privacyHide = el.checked; save('vx_users', list); }
  }
  if (el.dataset && el.dataset.act === 'notif') {
    const p = getPrefs(); p.notif = { ...p.notif, [el.dataset.v]: el.checked }; savePrefs(p);
  }
  if (el.dataset && el.dataset.act === 'lang') { const p = getPrefs(); p.lang = el.value; savePrefs(p); render(); }
  if (el.dataset && el.dataset.act === 'fx') { const p = getPrefs(); p.fx = { ...p.fx, [el.dataset.v]: el.checked }; savePrefs(p); }
  const form = el.form;
  if (el.name === 'img' && form && form.id === 'chatForm' && el.files && el.files[0]) {
    const tid = form.elements.tid.value;
    const text = form.elements.msg.value;
    try {
      const shot = putImg(await compress(el.files[0]));
      DRAFT = { tid, text, img: shot };
    } catch (err) { return flash('Could not load this photo. Try a JPG or PNG from your gallery.', 'err'); }
    S.flash = { m: 'Photo attached. Tap Send.', t: 'ok' };
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.name === 'msg' && el.form && el.form.id === 'chatForm') {
    const tid = el.form.elements.tid.value;
    DRAFT = { tid, text: el.value, img: DRAFT.tid === tid ? DRAFT.img : null };
    sendTyping(tid);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'authForm') authSubmit(e.target);
  else if (id === 'tForm') saveTournament(e.target);
  else if (id === 'payForm') savePaySettings(e.target);
  else if (id === 'newForm') newSubmit(e.target);
  else if (id === 'claimForm') claimSubmit(e.target);
  else if (id === 'chatForm') chatSubmit(e.target);
  else if (id === 'profileForm') saveProfile(e.target);
  else if (id === 'passForm') changePassword(e.target);
  else if (id === 'roomForm') saveRoom(e.target);
  else if (id === 'resultForm') saveResult(e.target);
  else if (id === 'wdForm') wdRequest(e.target);
  else if (id === 'qrForm') saveQr(e.target);
  else if (id === 'annForm') { const u = me(); if (!isAdmin(u)) return; addNote('all', 'Announcement', String(e.target.elements.text.value || '').trim().slice(0, 300)); e.target.reset(); flash('Announcement posted.'); }
});

// ---------- start ----------
seed();
render();
startCloud();
startTyping();
setInterval(checkAlerts, 60000);
setTimeout(() => { const s = document.getElementById('splash'); if (s) s.remove(); }, 1500);
</script>
